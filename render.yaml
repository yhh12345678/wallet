services:
  - type: web
    runtime: static
    name: wallet
    buildCommand: npm ci --include=dev && npm run build:render
    staticPublishPath: ./dist/render
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: WALLET_SUPABASE_URL
        sync: false
      - key: WALLET_SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
